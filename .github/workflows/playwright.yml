name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BASE_URL: https://opensource-demo.orangehrmlive.com
  DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
  DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

jobs:
  chromium:
    name: Chromium regression
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$DEMO_USERNAME" || (echo "DEMO_USERNAME secret is not configured" && exit 1)
          test -n "$DEMO_PASSWORD" || (echo "DEMO_PASSWORD secret is not configured" && exit 1)
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium tests
        run: npm run test:chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 30

  cross-browser:
    name: ${{ matrix.browser }} regression
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$DEMO_USERNAME" || (echo "DEMO_USERNAME secret is not configured" && exit 1)
          test -n "$DEMO_PASSWORD" || (echo "DEMO_PASSWORD secret is not configured" && exit 1)
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        run: npm run test:${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
